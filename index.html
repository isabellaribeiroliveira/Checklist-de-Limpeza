<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#023D3A">
  <title>Checklist de Limpeza · Univale</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* ============ Tokens ============ */
:root {
  --tinta: #12232A; --tinta-2: #3D5258; --suave: #63777C;
  --fundo: #EEF6F5; --fundo-2: #E1EEEC; --superficie: #FFFFFF; --superficie-2: #F4FAF9;
  --linha: #D6E7E4; --linha-forte: #BFD8D4;
  /* cores da marca Univale */
  --escuro: #023D3A; --verde-marca: #007A6E; --petroleo: #00A19B; --petroleo-2: #1CB5AE; --aqua: #1CCFC9; --menta: #D6F0ED; --vermelho-marca: #E6062E;
  --petroleo-claro: #D6F0ED; --petroleo-txt: #007A6E;
  --o: #1E7A4C; --b: #8DAA3B; --r: #E0A21B; --i: #C8372D; --na: #94A3A6;
  --o-claro: #E2F2E9; --r-claro: #FFF5DD; --i-claro: #FBE7E5;
  --raio: 16px; --raio-p: 10px;
  --sombra: 0 1px 2px rgba(18, 35, 42, .05), 0 6px 20px rgba(18, 35, 42, .06);
  --sombra-forte: 0 2px 6px rgba(18, 35, 42, .08), 0 16px 40px rgba(18, 35, 42, .12);
  --fonte: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
  --fonte-titulo: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', sans-serif;
  --topo: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --tinta: #E6EEEF; --tinta-2: #C3D0D2; --suave: #93A6AA;
    --fundo: #071615; --fundo-2: #0E2322; --superficie: #102A28; --superficie-2: #143331;
    --linha: #1E3E3B; --linha-forte: #2A504C;
    --escuro: #021F1E; --verde-marca: #1CB5AE; --petroleo: #11ABA4; --petroleo-2: #1CCFC9; --aqua: #1CCFC9; --menta: #0F3B39;
    --petroleo-claro: #0F3B39; --petroleo-txt: #5FE0D9;
    --o: #38A26C; --b: #9BBB49; --r: #E8B032; --i: #E0574C; --na: #6E8085;
    --o-claro: #163327; --r-claro: #3A2F14; --i-claro: #3B1C1A;
    --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    --sombra-forte: 0 2px 6px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; color: var(--tinta); font: 16px/1.5 var(--fonte); padding-bottom: env(safe-area-inset-bottom, 0px);
  background: radial-gradient(1200px 500px at 85% -10%, var(--petroleo-claro), transparent 60%), var(--fundo); background-attachment: fixed; min-height: 100vh; }
body.sem-rolagem { overflow: hidden; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.12; margin: 0 0 .5em; letter-spacing: -.005em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 600; }
h3 { font-size: 1.15rem; font-weight: 600; }
p { margin: 0 0 .75em; }
a { color: var(--petroleo-txt); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--r); outline-offset: 2px; border-radius: 6px; }
.suave { color: var(--suave); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
code { font-size: .85em; background: var(--superficie-2); padding: .1em .35em; border-radius: 5px; }

/* ============ Botões e campos ============ */
.btn { border: 0; border-radius: var(--raio-p); padding: .7em 1.25em; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .45em; min-height: 46px; text-decoration: none;
  transition: background-color .15s, border-color .15s, box-shadow .15s, transform .1s; }
.btn.primario { background: linear-gradient(180deg, var(--petroleo-2), var(--petroleo) 55%, var(--verde-marca)); color: #fff; box-shadow: 0 2px 10px rgba(0, 161, 155, .3); }
.btn.primario:hover { box-shadow: 0 6px 18px rgba(0, 161, 155, .4); }
.btn.sec { background: var(--superficie); border: 1.5px solid var(--linha-forte); color: var(--tinta); }
.btn.sec:hover { border-color: var(--petroleo); }
.btn.largo { width: 100%; }
.btn.pequeno { min-height: 36px; padding: .35em .95em; font-size: .9rem; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .6; cursor: wait; }
a.btn.primario { color: #fff; }
.link { background: none; border: 0; padding: .25em 0; color: var(--petroleo-txt); font-weight: 600; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.link.perigo, .perigo-txt { color: var(--i); }
label { display: flex; flex-direction: column; gap: .35em; font-size: .9rem; font-weight: 600; color: var(--tinta-2); }
input, select, textarea { border: 1.5px solid var(--linha-forte); border-radius: var(--raio-p); padding: .7em .85em; background: var(--superficie); font-weight: 400; color: var(--tinta); min-height: 46px; width: 100%;
  transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--petroleo); outline: none; box-shadow: 0 0 0 4px var(--petroleo-claro); }
input:disabled { background: var(--superficie-2); color: var(--suave); }
textarea { resize: vertical; }
#fPrefixo { text-transform: uppercase; font-weight: 700; letter-spacing: .05em; }
.erro-msg { color: var(--i); font-weight: 600; min-height: 1.5em; margin-top: .75em; }
fieldset { border: 1.5px solid var(--linha); border-radius: var(--raio-p); padding: .8rem 1rem 1rem; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
legend { font-weight: 600; color: var(--suave); font-size: .9rem; padding: 0 .35rem; }
label.check { flex-direction: row; align-items: center; gap: .6rem; font-weight: 500; color: var(--tinta); font-size: .95rem; cursor: pointer; }
label.check input { width: 20px; height: 20px; min-height: 0; accent-color: var(--petroleo); flex: none; }
label.check.forte { font: 700 1.2rem var(--fonte-titulo); }
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
.linha3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; align-items: end; }
@media (max-width: 600px) { .linha2, .linha3 { grid-template-columns: 1fr; } }
.acoes { display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap; margin-top: .75rem; }
.acoes-inline { display: flex; gap: .6rem; flex-wrap: wrap; }

/* ============ Escala de notas ============ */
.chip { display: inline-grid; place-items: center; min-width: 2.1em; height: 1.75em; padding: 0 .4em; border-radius: 999px; color: #fff; font: 700 .82rem/1 var(--fonte-titulo); letter-spacing: .03em; }
.n-O { --c: var(--o); } .n-B { --c: var(--b); } .n-R { --c: var(--r); } .n-I { --c: var(--i); } .n-NA { --c: var(--na); }
.chip.n-O, .chip.n-B, .chip.n-R, .chip.n-I, .chip.n-NA { background: var(--c); }
.chip.n-R { color: #12232A; }
.escala { list-style: none; padding: 0; margin: 1.5em 0 0; display: flex; flex-wrap: wrap; gap: .5em 1.1em; }
.escala li { display: flex; align-items: center; gap: .45em; font-weight: 500; }
.escala.compacta { margin: 0 0 .5em; font-size: .9rem; gap: .35em .9em; }

/* ============ Marca ============ */
.marca-sinal { display: inline-grid; grid-template-columns: repeat(4, 6px); gap: 3px; height: 28px; align-items: end; }
.marca-sinal i { display: block; border-radius: 3px; }
.marca-sinal i:nth-child(1) { height: 100%; background: var(--o); }
.marca-sinal i:nth-child(2) { height: 76%; background: var(--b); }
.marca-sinal i:nth-child(3) { height: 52%; background: var(--r); }
.marca-sinal i:nth-child(4) { height: 30%; background: var(--i); }
.marca-sinal.grande { grid-template-columns: repeat(4, 14px); gap: 6px; height: 64px; margin-bottom: 1.5rem; }

/* ============ Login ============ */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
.login-lado { position: relative; overflow: hidden; color: #fff; padding: clamp(2rem, 7vw, 6rem); display: flex; flex-direction: column; justify-content: center;
  background: radial-gradient(520px 520px at 105% 8%, rgba(28, 207, 201, .28), transparent 62%), radial-gradient(600px 420px at -5% 105%, rgba(0, 161, 155, .45), transparent 60%), linear-gradient(155deg, #034A46, #023D3A 60%, #012B29); }
.login-lado::before, .login-lado::after { content: ""; position: absolute; border-radius: 50%; background: rgba(28, 207, 201, .08); }
.login-lado::after { right: -140px; top: -140px; width: 420px; height: 420px; }
.login-lado::before { left: 38%; bottom: -90px; width: 220px; height: 220px; background: rgba(255, 255, 255, .05); }
.login-lado > * { position: relative; z-index: 1; }
.logo-login { width: 190px; height: auto; display: block; margin-bottom: 2rem; }
.login-lado h1 { font-size: clamp(2.6rem, 6vw, 4.4rem); margin-bottom: .3em; }
.login-lado p { max-width: 32ch; font-size: 1.15rem; opacity: .9; }
.login-lado .chip.n-NA { background: #6F8186; }
.login-form { align-self: center; justify-self: center; width: min(400px, 88vw); display: flex; flex-direction: column; gap: 1rem; padding: 2rem; margin: 2rem 0;
  background: var(--superficie); border-radius: 20px; box-shadow: var(--sombra-forte); }
.rodape-login { font-size: .82rem; text-align: center; margin: .25rem 0 0; }
@media (max-width: 760px) {
  .login { grid-template-columns: 1fr; min-height: auto; }
  .login-lado { padding: 2.5rem 1.5rem 3.5rem; padding-top: calc(2.5rem + env(safe-area-inset-top, 0px)); }
  .login-form { margin-top: -2rem; position: relative; }
  .marca-sinal.grande { height: 44px; grid-template-columns: repeat(4, 10px); margin-bottom: 1rem; }
}

/* ============ Topo ============ */
.topo { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem 1.5rem; flex-wrap: wrap;
  padding: .6rem clamp(1rem, 3vw, 2rem); padding-top: calc(.6rem + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--superficie) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--linha); }
.marca { display: flex; align-items: center; gap: .7rem; }
.marca strong { display: block; font: 700 1.2rem/1.1 var(--fonte-titulo); }
.marca small { color: var(--suave); font-size: .76rem; }
.nav { display: flex; gap: .2rem; flex: 1; overflow-x: auto; scrollbar-width: none; padding: .2rem; background: var(--fundo-2); border-radius: 999px; max-width: max-content; }
.nav::-webkit-scrollbar { display: none; }
.nav-link { background: none; border: 0; padding: .5em 1em; border-radius: 999px; font-weight: 600; color: var(--suave); cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.nav-link:hover { color: var(--tinta); }
.nav-link.ativo { background: var(--superficie); color: var(--petroleo-txt); box-shadow: 0 1px 3px rgba(18, 35, 42, .12); }
.usuario { display: flex; align-items: center; gap: .9rem; font-size: .92rem; margin-left: auto; }
.usuario span { display: flex; flex-direction: column; line-height: 1.2; font-weight: 600; text-align: right; }
.usuario small { color: var(--suave); font-weight: 400; }
@media (max-width: 760px) { .nav { order: 3; flex-basis: 100%; max-width: 100%; } .usuario span { display: none; } }
.aviso-versao { position: sticky; top: 0; z-index: 40; background: #8A5D00; color: #fff; padding: .7rem clamp(1rem, 3vw, 2rem); font-size: .92rem; }
.aviso-versao .link { color: #fff; margin-left: .5rem; }

/* ============ Páginas e blocos ============ */
.pagina { max-width: 1200px; margin: 0 auto; padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1rem, 3vw, 2rem) 4rem; }
.bloco { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--sombra); }
.sem-margem { margin: 0; }
.vazio { text-align: center; padding: 3rem 1rem; color: var(--suave); }
.vazio .giro { margin: 0 auto 1rem; }
.giro { display: block; width: 32px; height: 32px; border: 3px solid var(--linha); border-top-color: var(--petroleo); border-radius: 50%; animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }
.titulo-sec { margin: 2.25rem 0 1rem; }
.rolagem { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--raio); }
.apagado { opacity: .55; }
.badge { display: inline-block; font-size: .76rem; font-weight: 700; padding: .2em .65em; border-radius: 999px; background: var(--fundo-2); color: var(--suave); }
.badge.st-PLANEJADO { background: var(--petroleo-claro); color: var(--petroleo-txt); }
.badge.st-REALIZADO { background: var(--o-claro); color: var(--o); }
.badge.st-CANCELADO { background: var(--i-claro); color: var(--i); }
.aviso-hist { background: var(--petroleo-claro); color: var(--petroleo-txt); border-radius: var(--raio-p); padding: .7rem 1rem; font-size: .92rem; margin-bottom: 1.25rem; }
.nota-crono { background: var(--r-claro); border-left: 4px solid var(--r); padding: .55rem .8rem; border-radius: 0 8px 8px 0; font-size: .9rem; margin-top: .6rem !important; }

/* escolha de auditoria / checklist */
.auditorias, .escolha { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; margin: 1.25rem 0 2rem; }
.aud-card, .escolha-item { text-align: left; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 1.15rem 1.25rem; cursor: pointer;
  display: flex; flex-direction: column; gap: .35rem; box-shadow: var(--sombra); position: relative; overflow: hidden;
  transition: transform .15s, box-shadow .15s, border-color .15s; }
.aud-card::before, .escolha-item::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--petroleo); }
.aud-card:hover, .escolha-item:hover { transform: translateY(-2px); box-shadow: var(--sombra-forte); }
.aud-card:active, .escolha-item:active { transform: scale(.99); }
.aud-card strong, .escolha-item strong { font: 700 1.45rem/1.1 var(--fonte-titulo); }
.aud-card small, .escolha-item small { color: var(--suave); }
.aud-card.st-REALIZADO::before, .escolha-item.ja-enviado::before { background: var(--o); }
.aud-ciclo { font: 700 .95rem var(--fonte-titulo); color: var(--petroleo-txt); letter-spacing: .02em; }
.aud-locais { color: var(--tinta-2); }
.aud-rodape { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; font-size: .86rem; color: var(--suave); }
.aud-cab p { margin: .2rem 0; }
.escolha-tipo { font-size: .8rem; color: var(--suave); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.escolha-item em { font-style: normal; font-size: .82rem; font-weight: 700; color: #8A5D00; background: var(--r-claro); border-radius: 999px; padding: .2em .7em; align-self: flex-start; margin-top: .35rem; }
.escolha-item em.ok { color: var(--o); background: var(--o-claro); }
.escolha-item.ja-enviado { background: color-mix(in srgb, var(--o-claro) 35%, var(--superficie)); }
.rodape-card { display: flex; align-items: center; gap: .75rem; margin-top: .35rem; }
.rodape-card em { margin-top: 0 !important; }
.rodape-card .ver { font-size: .86rem; font-weight: 700; color: var(--petroleo-txt); white-space: nowrap; }
.barra-planilha { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: .95rem 1.15rem; margin: 1rem 0 1.25rem; box-shadow: var(--sombra); border-left: 5px solid var(--o); }
.barra-planilha strong { display: block; font: 600 1.15rem var(--fonte-titulo); }
.barra-planilha .suave { font-size: .9rem; }
.barra-planilha.pendente { border-left-color: var(--r); }
.barra-planilha.liberado { border-left-color: var(--o); }

/* ============ Formulário do checklist ============ */
.form { padding-bottom: 7.5rem; }
.form-cab { margin-bottom: 1.25rem; }
.form-cab .aud-ciclo { display: block; margin-bottom: .2rem; }
.voltar { margin-bottom: .75rem; display: inline-block; }
.regra { color: var(--suave); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; max-width: 660px; }
.legenda { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: .9rem 1.1rem; margin-bottom: 1.5rem; font-size: .9rem; box-shadow: var(--sombra); }
.legenda p { margin: 0; color: var(--suave); }
.abas-colunas { position: sticky; top: var(--topo, 64px); z-index: 10; padding: .6rem 0; margin-bottom: 1rem; display: flex; flex-direction: column; gap: .6rem;
  background: color-mix(in srgb, var(--fundo) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.grupo { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.grupo-nome { font: 600 1rem var(--fonte-titulo); color: var(--suave); min-width: 7.5em; }
.tabs { display: flex; gap: .45rem; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
.tab { flex: none; background: var(--superficie); border: 1.5px solid var(--linha); border-radius: 12px; padding: .4em .9em; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start;
  line-height: 1.2; min-height: 46px; justify-content: center; transition: background-color .15s, border-color .15s; }
.tab span { font-weight: 700; }
.tab small { font-size: .76rem; color: var(--suave); }
.tab.completa { border-color: var(--o); }
.tab.completa small { color: var(--o); }
.tab.ativa { background: var(--petroleo); border-color: var(--petroleo); color: #fff; box-shadow: 0 3px 10px rgba(0, 161, 155, .3); }
.tab.ativa small { color: rgba(255, 255, 255, .8); }
.tab.adicionar { border-style: dashed; color: var(--petroleo-txt); font-weight: 700; flex-direction: row; }
@media (max-width: 600px) { .grupo { flex-direction: column; align-items: stretch; gap: .3rem; } .grupo-nome { min-width: 0; } }
.veic-cab { display: flex; align-items: flex-end; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
.veic-cab label { flex: 1 1 260px; max-width: 360px; }
.local-nome { margin: 0; }
.secao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 1.25rem; overflow: hidden; box-shadow: var(--sombra); }
.secao h3 { margin: 0; padding: .8rem 1.15rem; font-size: 1.15rem; color: var(--petroleo-txt); background: var(--petroleo-claro); }
.item { padding: .95rem 1.15rem; border-top: 1px solid var(--linha); display: grid; grid-template-columns: minmax(180px, 1fr) auto; gap: .6rem 1.25rem; align-items: center; scroll-margin: 150px; transition: background-color .2s; }
.secao h3 + .item { border-top: 0; }
.item-nome { font-weight: 600; }
.item.feito .item-nome { color: var(--suave); }
.item.erro { background: var(--i-claro); box-shadow: inset 4px 0 0 var(--i); }
.item .campo, .item .evidencia { grid-column: 1 / -1; }
.notas { display: grid; grid-template-columns: repeat(5, minmax(60px, 1fr)); gap: 4px; padding: 4px; background: var(--fundo-2); border-radius: 14px; }
.nota { border: 0; background: transparent; border-radius: 10px; padding: .4em .3em; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.1; min-height: 50px; justify-content: center;
  transition: background-color .15s, box-shadow .15s, transform .1s; }
.nota b { font: 700 1.25rem/1 var(--fonte-titulo); color: var(--c); }
.nota span { font-size: .66rem; color: var(--suave); margin-top: 3px; }
.nota:hover { background: var(--superficie); }
.nota:active { transform: scale(.96); }
.nota.sel { background: var(--c); box-shadow: 0 3px 10px color-mix(in srgb, var(--c) 45%, transparent); }
.nota.sel b, .nota.sel span { color: #fff; }
.nota.n-R.sel b, .nota.n-R.sel span { color: #12232A; }
@media (max-width: 700px) { .item { grid-template-columns: 1fr; } .notas { grid-template-columns: repeat(5, 1fr); } .nota span { font-size: .6rem; } }

/* ============ Painel ============ */

  background: radial-gradient(380px 260px at 110% -10%, rgba(28, 207, 201, .45), transparent 60%), linear-gradient(160deg, #00857F, #023D3A 75%); }

@media (max-width: 760px) { .resultado { grid-template-columns: 1fr; } }

.tab-resultado td.num { font-weight: 700; font-size: 1.05rem; }
.grupo-linha th { background: var(--petroleo-claro); color: var(--petroleo-txt); font: 600 1rem var(--fonte-titulo); text-transform: none; letter-spacing: 0; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 1rem; }
.card { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 1.15rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: var(--sombra); }

.obs { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); display: grid; grid-template-columns: 130px 1fr; overflow: hidden; box-shadow: var(--sombra); }
.obs-foto { background: var(--superficie-2); min-height: 130px; }

.foto-abrir { border: 0; padding: 0; width: 100%; height: 100%; cursor: zoom-in; background: none; display: block; }

.obs-texto { padding: .85rem 1rem; font-size: .92rem; }

@media (max-width: 420px) { .observacoes { grid-template-columns: 1fr; } .obs { grid-template-columns: 1fr; } .obs-foto { min-height: 180px; } }

/* detalhe */
.det-cab { display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; flex-wrap: wrap; padding-right: 2rem; }

/* ============ Cronograma ============ */
.crono-lista { display: flex; flex-direction: column; gap: 1.25rem; }

.ciclo { border: 1.5px solid var(--linha); border-radius: 14px; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .5rem; align-items: flex-start; background: var(--superficie); }

.ciclo.vazio { border-style: dashed; background: none; cursor: pointer; color: var(--petroleo-txt); font-weight: 700; justify-content: center; align-items: center; min-height: 120px; transition: background-color .15s, border-color .15s; }

.locais li.garagem { background: var(--tinta); color: var(--superficie); }
.auds { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; }
.pessoa { font-weight: 600; font-size: .88rem; border: 1.5px solid var(--petroleo); color: var(--petroleo-txt); border-radius: 999px; padding: .1em .7em; }
.mapa { margin-top: .9rem; }
.mapa summary { cursor: pointer; font-weight: 700; color: var(--petroleo-txt); padding: .3rem 0; }
.tab-mapa th, .tab-mapa td { padding: .35rem .5rem; font-size: .85rem; text-align: center; white-space: nowrap; }

.tab-mapa td.marcado { background: var(--petroleo); color: #fff; font-weight: 700; border-radius: 6px; }
.tab-mapa tfoot th { font-size: .78rem; font-weight: 500; background: var(--superficie-2); color: var(--tinta); }
.propostas { display: grid; gap: 1rem; margin: 1.25rem 0; }
.prop { border: 1px solid var(--linha); border-radius: var(--raio); padding: .95rem 1rem; background: var(--superficie-2); }
.prop header { display: flex; justify-content: space-between; gap: .75rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }

.forca span.on.f1 { background: var(--i); } .forca span.on.f2 { background: var(--r); } .forca span.on.f3 { background: var(--b); } .forca span.on.f4 { background: var(--o); }
.forca-txt { font-size: .85rem; margin: -.5rem 0 0; }

/* ============ Diagnóstico ============ */
.lista-diag { list-style: none; padding: 0; margin: 1.5rem 0; display: grid; gap: .6rem; max-width: 820px; }
.diag { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-p); padding: .85rem 1rem; box-shadow: var(--sombra); }

.diag.ok > b { background: var(--o); } .diag.falha > b { background: var(--i); } .diag.falha { border-color: color-mix(in srgb, var(--i) 40%, transparent); }

/* ============ Modal, toast, carregando ============ */
.modal-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(8, 20, 24, .55); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 1rem; animation: surgirFundo .16s ease-out; }
.modal { background: var(--superficie); border-radius: 20px; width: min(470px, 100%); max-height: calc(100vh - 2rem); overflow: auto; position: relative; padding: 1.6rem; box-shadow: var(--sombra-forte); animation: surgirModal .2s cubic-bezier(.2, .7, .2, 1); }

.modal-fechar { position: absolute; top: .7rem; right: .8rem; border: 0; background: var(--fundo-2); font-size: 1.4rem; line-height: 1; cursor: pointer; color: var(--suave); width: 36px; height: 36px; border-radius: 50%; }
#toast { position: fixed; left: 50%; bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--tinta); color: var(--superficie); padding: .8rem 1.15rem; border-radius: 14px;
  max-width: min(92vw, 520px); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 70; box-shadow: var(--sombra-forte); }
#toast.mostrar { opacity: 1; transform: translate(-50%, 0); }
#toast.erro { background: var(--i); color: #fff; } #toast.ok { background: var(--o); color: #fff; } #toast.aviso { background: #8A5D00; color: #fff; }
#carregando { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--fundo) 75%, transparent); backdrop-filter: blur(2px); display: grid; place-items: center; animation: surgirFundo .15s ease-out; }
.carregando-caixa { background: var(--superficie); border-radius: 16px; padding: 1.5rem 2rem; text-align: center; border: 1px solid var(--linha); box-shadow: var(--sombra-forte); max-width: 90vw; }

.carregando-caixa p { margin: 0; font-weight: 600; }
.foto-cheia { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .9); display: grid; place-items: center; padding: 1rem; cursor: zoom-out; }
.foto-cheia img { max-width: 100%; max-height: 100%; border-radius: 10px; }
.foto-cheia button { position: absolute; top: calc(.5rem + env(safe-area-inset-top, 0px)); right: 1rem; background: none; border: 0; color: #fff; font-size: 2.2rem; cursor: pointer; }

/* ============ Movimento ============ */
@keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes surgirFundo { from { opacity: 0; } to { opacity: 1; } }
@keyframes surgirModal { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes brilho { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
.pagina > *, #conteudo > *, #lista > * { animation: entrar .22s cubic-bezier(.2, .7, .2, 1) both; }
.pagina > *:nth-child(2) { animation-delay: .03s; } .pagina > *:nth-child(3) { animation-delay: .06s; }
.quieto > *, .quieto .pagina > * { animation: none !important; }
.esqueleto { display: flex; flex-direction: column; gap: 1rem; padding-top: .5rem; }
.esq { border-radius: var(--raio); background: linear-gradient(90deg, var(--fundo-2) 25%, var(--superficie-2) 37%, var(--fundo-2) 63%); background-size: 400% 100%; animation: brilho 1.3s ease-in-out infinite; }
.esq.titulo { height: 2.4rem; width: min(420px, 70%); }
.esq-linha { display: grid; grid-template-columns: 300px 1fr; gap: 1rem; }

@media (max-width: 700px) { .esq-linha { grid-template-columns: 1fr; } .esq.bloco { height: 120px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

/* ============ Ajustes finos ============ */
.login-form .erro-msg:empty { display: none; }
.tab-filiais td:first-child strong, .tab-lista td:first-child { white-space: nowrap; }
@media (max-width: 760px) {
  .topo { gap: .6rem; padding-bottom: .5rem; }
  .nav { width: fit-content; max-width: 100%; }
}
@media (max-width: 480px) {

}

/* ============ Escala: prazo e confirmação ============ */

  color: var(--petroleo-txt); background: var(--petroleo-claro); border-radius: 999px; padding: .2em .7em; }

.ciclo.sit-aguardando { border-style: dashed; border-color: color-mix(in srgb, var(--r) 60%, transparent); }
.ciclo.sit-atrasada { border-color: var(--i); background: color-mix(in srgb, var(--i-claro) 40%, var(--superficie)); }
.datas-escala { display: flex; flex-wrap: wrap; gap: .4rem .9rem; margin: 0; font-size: .86rem; color: var(--suave); }
.datas-escala b { color: var(--tinta); }
.acoes-ciclo { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: .2rem; }
.resumo-escala { display: flex; gap: .5rem; flex-wrap: wrap; margin: .25rem 0 0; }


/* ============ Marca, estratificado e KPIs clicáveis ============ */
.logo-topo { height: 30px; width: auto; display: block; }
.logo-topo.branca { display: none; }
@media (prefers-color-scheme: dark) { .logo-topo.cor { display: none; } .logo-topo.branca { display: block; } }
.marca-texto { display: flex; flex-direction: column; border-left: 1.5px solid var(--linha); padding-left: .75rem; }
.marca-texto strong { font: 700 1.05rem/1.1 var(--fonte-titulo); }
.marca-texto small { color: var(--suave); font-size: .72rem; letter-spacing: .04em; }
@media (max-width: 480px) { .logo-topo { height: 24px; } .marca-texto small { display: none; } .marca-texto strong { font-size: .95rem; } }
.nav-link.ativo { position: relative; }
.nav-link.ativo::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--vermelho-marca); }

.clicavel { cursor: pointer; transition: transform .15s, box-shadow .15s, border-color .15s; }
.clicavel:hover { transform: translateY(-2px); box-shadow: var(--sombra-forte); border-color: color-mix(in srgb, var(--petroleo) 45%, var(--linha)); }
.clicavel:focus-visible { outline: 3px solid var(--aqua); }
.dica-clique { font-size: .76rem; color: var(--petroleo-txt); font-weight: 700; display: inline-flex; align-items: center; gap: .3em; }
.dica-clique::after { content: "→"; transition: transform .15s; }
.clicavel:hover .dica-clique::after { transform: translateX(3px); }
.nota-final .dica-clique { color: var(--aqua); margin-top: .6rem; }
tr.clicavel:hover td { background: color-mix(in srgb, var(--menta) 55%, var(--superficie)); }
tr.clicavel { transform: none !important; box-shadow: none !important; }

.delta { display: inline-flex; align-items: center; gap: .15em; font: 700 .74rem var(--fonte); padding: .12em .45em; border-radius: 999px; margin-left: .45em; vertical-align: middle; white-space: nowrap; }
.delta.sobe { color: var(--o); background: var(--o-claro); }
.delta.desce { color: var(--i); background: var(--i-claro); }
.delta.igual { color: var(--suave); background: var(--fundo-2); }
.nota-final .delta { background: rgba(255, 255, 255, .14); color: #fff; font-size: .85rem; margin: .35rem 0 0; align-self: flex-start; }

.rodada { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; margin-bottom: 1.25rem; }
.rodada > div { padding: .9rem 1.1rem; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); }
.rodada small { display: block; font-size: .74rem; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .3rem; }
.rodada .valor { font-weight: 700; }
.rodada .locais li { font-size: .84rem; }
.rodada-cab { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin: 0 0 .6rem; }
.rodada-cab h2 { margin: 0; font-size: 1.2rem; }

.tab-local td:first-child { min-width: 210px; }
.tag-local { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: .12em .5em; border-radius: 999px; margin-left: .4em; vertical-align: middle; }
.tag-local.garagem { background: var(--escuro); color: var(--aqua); }
.tag-local.ponto { background: var(--menta); color: var(--verde-marca); }
.nota-cel { font-weight: 700; font-variant-numeric: tabular-nums; }
.nota-cel.baixa { color: var(--i); } .nota-cel.media { color: #B07A00; } .nota-cel.alta { color: var(--o); }
.mini-barra { display: flex; height: 6px; border-radius: 99px; overflow: hidden; background: var(--fundo-2); margin-top: 4px; min-width: 90px; }
.mini-barra span { background: var(--c); }

.criticos { display: grid; gap: .75rem; }
.critico { display: grid; grid-template-columns: auto 1fr auto; gap: .9rem; align-items: start; background: var(--superficie); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: .85rem 1rem; box-shadow: var(--sombra); }
.critico .pos { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 1rem var(--fonte-titulo); background: var(--escuro); color: var(--aqua); }
.critico h4 { margin: 0 0 .2rem; font: 700 1.05rem var(--fonte-titulo); }
.critico p { margin: .15rem 0 0; font-size: .88rem; color: var(--tinta-2); }
.critico .contagens { display: flex; gap: .3rem; }
.critico-fotos { display: flex; gap: .4rem; margin-top: .5rem; flex-wrap: wrap; }
.critico-fotos .foto-lazy { width: 74px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--superficie-2); padding: 0; font-size: .65rem; }
.critico-fotos .foto-abrir img { min-height: 0; height: 56px; }

.kpi-modal .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .75rem; margin: 1rem 0 1.25rem; }
.kpi { background: var(--superficie-2); border: 1px solid var(--linha); border-radius: 14px; padding: .8rem 1rem; }
.kpi small { display: block; color: var(--suave); font-size: .78rem; font-weight: 600; }
.kpi strong { font: 700 1.7rem/1.15 var(--fonte-titulo); font-variant-numeric: tabular-nums; }
.kpi.destaque { background: linear-gradient(160deg, #00857F, #023D3A); color: #fff; border: 0; }
.kpi.destaque small { color: rgba(255, 255, 255, .75); }
.kpi-modal h3 { margin: 1.25rem 0 .6rem; }
.barra-peso { height: 8px; border-radius: 99px; background: var(--fundo-2); overflow: hidden; min-width: 110px; }
.barra-peso span { display: block; height: 100%; background: linear-gradient(90deg, var(--aqua), var(--petroleo)); }
.veic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: .6rem; }
.veic { border: 1px solid var(--linha); border-radius: 12px; padding: .65rem .8rem; background: var(--superficie); }
.veic b { font: 700 1.05rem var(--fonte-titulo); }
.veic small { display: block; color: var(--suave); font-size: .76rem; }
.veic .criticos-v { font-size: .76rem; color: var(--i); margin-top: .25rem; }

.barra-planilha.apresentacao { border-left-color: var(--aqua); background: linear-gradient(90deg, color-mix(in srgb, var(--menta) 60%, var(--superficie)), var(--superficie) 60%); }
.config-email { display: grid; gap: .75rem; }
.config-email .linha-botoes { display: flex; gap: .6rem; flex-wrap: wrap; }
.colega { font-size: .78rem; color: var(--suave); }
.tag-local { white-space: nowrap; }
.logo-topo { height: 36px; }
@media (max-width: 480px) { .logo-topo { height: 26px; } }

/* ============ v33 · marca, login animado, gestor e Fluig ============ */
.bucha { width: 40px; height: 40px; flex: none; filter: drop-shadow(0 3px 6px rgba(2, 61, 58, .18)); }
.bucha .bolha { transform-box: fill-box; transform-origin: center; animation: bolha 3.2s ease-in-out infinite; }
.bucha .b2 { animation-delay: .8s; } .bucha .b3 { animation-delay: 1.6s; }
@keyframes bolha { 0%, 100% { transform: translateY(0) scale(1); opacity: .9; } 50% { transform: translateY(-3px) scale(1.12); opacity: .55; } }
.marca { gap: .65rem; }
.marca-texto { border-left: 0; padding-left: 0; }
.usuario .logo-topo { height: 30px; margin-right: .2rem; }
.sep-usuario { width: 1.5px; height: 30px; background: var(--linha); display: block !important; }
@media (max-width: 760px) { .usuario .logo-topo, .sep-usuario { display: none !important; } .bucha { width: 34px; height: 34px; } }

.login-topo { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2.2rem; max-width: 560px; }
.login-topo .logo-login { width: 170px; margin: 0; }
.bucha-login { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(6px); }
.bucha-login .bucha { width: 46px; height: 46px; }
.vitrine { margin: 1.6rem 0 .4rem; max-width: 520px; padding: 1rem 1.1rem .6rem; border-radius: 22px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .18); backdrop-filter: blur(4px); }
.grafico-marca { width: 100%; height: auto; display: block; overflow: visible; }
.grafico-marca .grade line { stroke: rgba(255, 255, 255, .12); stroke-width: 1; stroke-dasharray: 3 5; }
.grafico-marca .barra { fill: rgba(28, 207, 201, .22); transform-box: fill-box; transform-origin: bottom; animation: subirBarra .9s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * .08s + .2s); }
.grafico-marca .linha { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: desenhar 1.6s ease forwards; }
.grafico-marca .l1 { stroke: #F2A93B; animation-delay: .5s; } .grafico-marca .l2 { stroke: #E4572E; animation-delay: .75s; } .grafico-marca .l3 { stroke: #A79BFF; animation-delay: 1s; }
.grafico-marca .ponto-m { transform-box: fill-box; transform-origin: center; animation: pulsar 2.4s ease-in-out infinite, aparecer .4s ease both; animation-delay: calc(var(--i) * .25s + 1.9s), calc(var(--i) * .25s + 1.9s);
  stroke: #023D3A; stroke-width: 3; }
@keyframes subirBarra { from { transform: scaleY(0); } }
@keyframes desenhar { to { stroke-dashoffset: 0; } }
@keyframes aparecer { from { opacity: 0; transform: scale(0); } }
@keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
@media (max-width: 760px) { .vitrine { display: none; } .login-topo { margin-bottom: 1.2rem; } .bucha-login { width: 54px; height: 54px; } }

.cel-fluig .fluig { display: inline-flex; align-items: center; gap: .35em; font-weight: 700; color: var(--petroleo-txt); text-decoration: none; background: var(--menta);
  padding: .25em .7em; border-radius: 999px; font-size: .9rem; }
.cel-fluig a.fluig::after { content: "↗"; font-size: .85em; }
.cel-fluig a.fluig:hover { background: var(--petroleo); color: #fff; }
.tab-lista td small { display: block; color: var(--suave); font-size: .76rem; }

/* números e cartões com um pouco mais de vida */
.nota-final strong { text-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
.card, .crono-filial, .bloco, .tab-lista, .tab-resultado { transition: box-shadow .2s, transform .2s, border-color .2s; }
.rodada > div { transition: background-color .2s; }
.rodada > div:hover { background: color-mix(in srgb, var(--menta) 35%, var(--superficie)); }
@keyframes brilhoBorda { 0%, 100% { box-shadow: 0 0 0 0 rgba(28, 207, 201, 0); } 50% { box-shadow: 0 0 0 4px rgba(28, 207, 201, .18); } }
.btn.primario[data-acao="gerarApresentacao"] { animation: brilhoBorda 2.8s ease-in-out infinite; }
.rodada { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.usuario .logo-topo { height: 32px; }

  /* ---------- SENHA ---------- */
  function forcaSenha(v) {
    let p = 0;
    if (v.length >= 6) p++;
    if (v.length >= 10) p++;
    if (/[A-Za-zÀ-ú]/.test(v) && /\d/.test(v)) p++;
    if (/[^A-Za-z0-9À-ú]/.test(v) || (/[a-z]/.test(v) && /[A-Z]/.test(v))) p++;
    return p; // 0 a 4
  }
  function erroNovaSenha(nova, conf) {
    if (nova.length < 6) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (!/[A-Za-zÀ-ú]/.test(nova) || !/\d/.test(nova)) return 'Use letras e números na senha.';
    if (nova !== conf) return 'As duas senhas não são iguais.';
    return '';
  }
  const campoSenha = (nome, rotulo, auto) => `<label>${rotulo}<span class="campo-senha"><input type="password" name="${nome}" autocomplete="${auto}" required>
    <button type="button" class="mostrar-senha" data-mostrar aria-label="Mostrar senha">Mostrar</button></span></label>`;
  const medidor = () => `<div class="forca" aria-hidden="true"><span></span><span></span><span></span><span></span></div><p class="forca-txt suave">Mínimo 6 caracteres, com letras e números.</p>`;
  function ligarMedidor(form) {
    const inp = form.querySelector('input[name=novaSenha]');
    inp.addEventListener('input', () => {
      const p = forcaSenha(inp.value);
      form.querySelectorAll('.forca span').forEach((s, i) => { s.className = i < p ? 'on f' + p : ''; });
      form.querySelector('.forca-txt').textContent = !inp.value ? 'Mínimo 6 caracteres, com letras e números.' : ['Muito fraca', 'Fraca', 'Razoável', 'Boa', 'Forte'][p];
    });
  }

  VIEWS.primeiraSenha = function () {
    app.innerHTML = `<main class="login">

        <p>Este é o seu primeiro acesso. Crie uma senha só sua: a senha que você recebeu deixa de valer.</p>
      </section>
      <form class="login-form" id="fPrimeira" autocomplete="on">
        <h2>Crie sua senha</h2>
        <input type="text" name="usuario" value="${esc(state.sessao.login)}" autocomplete="username" hidden>

      const btn = form.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Salvando…'; $('#primErro').textContent = '';

          if (fechado) return `<div class="escolha-item fechado"><span class="escolha-tipo">${c.tipo === 'veiculo' ? 'Veículos' : 'Predial'}</span>
            <strong>${esc(c.titulo)}</strong><small>${esc(locaisDoModelo(c, a).join(' · '))}</small><em class="fechado">${a.finalizada ? 'Não enviado' : 'Prazo encerrado'}</em></div>`;

            ${env ? `<span class="rodape-card"><em class="ok">Enviado</em>${idEnvio ? '<span class="ver">Ver respostas</span>' : ''}</span>` : r ? `<em>Rascunho de ${fmtData(r.salvoEm)}</em>` : ''}

  function statusPrazo(a) {
    if (a.sem_checklists) return `<div class="aviso-hist">Esta auditoria foi feita antes do sistema e está registrada nas planilhas antigas. O resultado está disponível abaixo.</div>`;
    if (a.finalizada || !a.prazo) return '';

    if (d < 0) return `<div class="barra-planilha atraso"><div><strong>Prazo encerrado em ${fmtData(a.prazo)}</strong>

    return `<div class="barra-planilha ${d <= 3 ? 'pendente' : 'prazo-ok'}"><div><strong>${d === 0 ? 'O prazo termina hoje' : 'Prazo de envio: ' + fmtData(a.prazo)}</strong>
      <span class="suave">Liberada em ${fmtData(a.liberacao) || '—'}${d > 0 ? ' · ' + (d === 1 ? 'falta 1 dia' : 'faltam ' + d + ' dias') : ''}. Envie todos os checklists até essa data.</span></div></div>`;
  }

  function statusResultado(a) {
    const feitos = a.aplicaveis.filter((k) => a.enviados.includes(k)).length;

  function locaisDoModelo(ck, a) {
    if (ck.locais === 'garagem') return [a.garagem];
    if (ck.locais === 'pontos') return a.pontos.slice();
    return locaisAud(a);
  }

  async function abrirForm(cid, k) {
    if (prazoEncerrado(state.auditorias.get(cid))) { toast('O prazo desta auditoria terminou. Fale com a Qualidade para prorrogar.', 'erro'); return; }
    const r = lerRascunho(cid, k);
    if (r && await confirmar('Continuar rascunho?', `Há um rascunho salvo em ${fmtData(r.salvoEm)}. Deseja continuar de onde parou?`, 'Continuar rascunho')) {
      state.form = r;
    } else {
      if (r) localStorage.removeItem(chaveRascunho(cid, k));
      state.form = novoForm(state.auditorias.get(cid), k);
    }
    rota('form');
  }

  function respostasIniciais(ck) {
    const r = {};
    ck.secoes.forEach((s, si) => s.itens.forEach((it, ii) => { if (it.outros) r[`${si}-${ii}`] = { nota: 'NA' }; }));
    return r;
  }

  function novoForm(a, k) {
    const ck = CHECKLISTS[k]; const colunas = [];
    const locais = locaisDoModelo(ck, a);
    if (ck.tipo === 'veiculo') locais.forEach((l) => { for (let i = 0; i < (ck.min || 1); i++) colunas.push({ id: uid(), grupo: l, nome: '' }); });
    else locais.forEach((l) => colunas.push({ id: uid(), grupo: l, nome: l, fixo: true }));
    const respostas = {}; colunas.forEach((c) => { respostas[c.id] = respostasIniciais(ck); });
    return { cronogramaId: a.id, filial: a.filial_nome, ciclo: ciclo(a), chave: k, dataInspecao: hojeISO(), obs: '', colunas, respostas, ativa: colunas[0].id };
  }

  /* ---------- FORMULÁRIO ---------- */
  let rascunhoTimer;
  function salvarRascunho() {
    clearTimeout(rascunhoTimer);
    rascunhoTimer = setTimeout(() => {
      const f = state.form; if (!f) return;
      f.salvoEm = new Date().toISOString().slice(0, 16);
      const chave = chaveRascunho(f.cronogramaId, f.chave);
      try { localStorage.setItem(chave, JSON.stringify(f)); }
      catch (e) { // sem espaço para as fotos: guarda só as respostas
        try {
          const leve = JSON.parse(JSON.stringify(f));
          Object.values(leve.respostas).forEach((col) => Object.values(col).forEach((r) => { delete r.foto; }));
          localStorage.setItem(chave, JSON.stringify(leve));
        } catch (e2) {}
      }
    }, 400);

      <div class="notas" role="radiogroup" aria-label="${esc(it.nome)}">${ORDEM.map((n) => `<button type="button" role="radio" aria-checked="${r.nota === n}" class="nota n-${n} ${r.nota === n ? 'sel' : ''}" data-nota="${n}" title="${NOMES[n]}"><b>${n}</b><span>${NOMES[n]}</span></button>`).join('')}</div>
      ${it.outros && r.nota && r.nota !== 'NA' ? `<label class="campo">Qual item foi avaliado?<input data-campo="descricao" value="${esc(r.descricao || '')}" placeholder="Descreva o item"></label>` : ''}

          : `<label class="btn sec foto-btn">Tirar ou escolher foto<input type="file" accept="image/*" data-campo="foto" hidden></label>`}</div>

  function atualizarItem(colId, key) {
    const [si, ii] = key.split('-').map(Number);
    const el = document.getElementById(`it-${colId}-${key}`);
    if (el) el.outerHTML = itemHTML(colId, si, ii);
  }

  function atualizarProgresso() {
    const f = state.form; let feitos = 0; const total = totalItens() * f.colunas.length;
    f.colunas.forEach((c) => { feitos += statusColuna(c).feitos; });
    $('#progTxt').textContent = `${feitos} de ${total} itens avaliados`;
    $('#progBar').style.width = (total ? feitos / total * 100 : 0) + '%';
  }

  function comprimirFoto(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, 1280 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url); resolve(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não foi possível ler a imagem. Tente outra foto.')); };
      img.src = url;
    });
  }

  function validar() {
    const f = state.form, ck = ckAtual();
    if (!f.dataInspecao) return { msg: 'Informe a data da inspeção.', alvo: '#fData' };
    const prefixos = {};
    for (const c of f.colunas) {
      if (ck.tipo === 'veiculo') {
        const p = c.nome.trim().toUpperCase();
        if (!p) return { c, msg: `Informe o prefixo do ${rotuloColuna(c)} (${c.grupo}).`, alvo: '#fPrefixo' };
        if (prefixos[p]) return { c, msg: `O prefixo ${p} foi usado duas vezes.`, alvo: '#fPrefixo' };
        prefixos[p] = true;
      }
      for (let si = 0; si < ck.secoes.length; si++) {
        const s = ck.secoes[si];
        for (let ii = 0; ii < s.itens.length; ii++) {
          const it = s.itens[ii], key = `${si}-${ii}`, r = f.respostas[c.id][key] || {}, onde = `“${it.nome}” em ${rotuloColuna(c)}`;
          if (!r.nota) return { c, key, msg: `Avalie o item ${onde}.` };
          if (it.outros && r.nota !== 'NA' && !(r.descricao || '').trim()) return { c, key, msg: `Descreva qual item foi avaliado em ${onde}.` };
          if (exigeEvidencia(it.nome, r.nota)) {
            if (!(r.justificativa || '').trim()) return { c, key, msg: `Escreva o motivo da classificação de ${onde}.` };
            if (!r.foto) return { c, key, msg: `Anexe a foto de ${onde}.` };
          }
        }
      }
    }
    return null;
  }

  function irParaErro(e) {
    if (e.c && e.c.id !== state.form.ativa) { state.form.ativa = e.c.id; renderAbas(); renderColuna(); }
    const el = e.key ? document.getElementById(`it-${e.c.id}-${e.key}`) : $(e.alvo);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('erro'); if (!e.key && el.focus) el.focus(); }
    toast(e.msg, 'erro');
  }

  async function enviarChecklist() {
    const erro = validar(); if (erro) return irParaErro(erro);
    const f = state.form, ck = ckAtual();
    if (!await confirmar('Enviar checklist?', 'Depois do envio as respostas não podem ser alteradas.', 'Enviar checklist')) return;
    const dados = { cronogramaId: f.cronogramaId, checklist: f.chave, dataInspecao: f.dataInspecao, obsGerais: f.obs,
      colunas: f.colunas.map((c) => ({ id: c.id, grupo: c.grupo, nome: c.nome.trim() })), respostas: [] };
    f.colunas.forEach((c) => ck.secoes.forEach((s, si) => s.itens.forEach((it, ii) => {
      const r = f.respostas[c.id][`${si}-${ii}`]; const precisa = exigeEvidencia(it.nome, r.nota);
      dados.respostas.push({ colunaId: c.id, grupo: c.grupo, coluna: c.nome.trim(), secao: s.nome, item: it.nome, outros: !!it.outros,
        descricao: it.outros ? (r.descricao || '') : '', nota: r.nota, justificativa: precisa ? r.justificativa.trim() : '',
        foto: precisa && r.foto ? { mime: 'image/jpeg', base64: r.foto.split(',')[1] } : null });
    })));
    carregando('Enviando checklist e fotos…');
    try {
      await api('enviarChecklist', { dados });
      localStorage.removeItem(chaveRascunho(f.cronogramaId, f.chave));
      const cid = f.cronogramaId; state.form = null; carregando(); rota('enviado', { titulo: ck.titulo, cid });
    } catch (e) { carregando(); toast(e.message, 'erro'); }
  }

    const linha = (k) => `<tr class="clicavel" data-kpi="ck" data-chave="${k}"><td>${esc(rotuloIndicador(k, d))}</td><td class="num">${fmt(r.checklists[k].nota)}${deltaHTML(r.checklists[k].nota, a && a.checklists[k], antRot)}</td></tr>`;
    el.innerHTML = `
      ${modoAvaliador === true
        ? `<div class="painel-cab"><div><button class="link voltar" data-auditoria="${esc(d.cronograma.id)}">Voltar à auditoria</button>
            <span class="aud-ciclo">${ciclo(d.cronograma)} · resultado validado pela Qualidade em ${fmtData(d.cronograma.liberado_em)}</span><h1>Resultado · ${esc(f.nome)}</h1></div></div>`
        : modoAvaliador === 'gestor'
        ? `<div class="painel-cab"><div>${(d.permitidas || []).length > 1 ? '<button class="link voltar" data-ver-filial="">Minhas filiais</button>' : ''}<span class="aud-ciclo">Resultado validado pela Qualidade</span><h1>${esc(f.nome)}</h1></div>${filtros(d)}</div>`
        : `<div class="painel-cab"><div><button class="link voltar" data-ver-filial="">Todas as filiais</button><h1>${esc(f.nome)}</h1></div>${filtros(d)}</div>${barraLiberacao(d)}`}
      ${rodadaHTML(d)}
      ${modoAvaliador === 'gestor' ? (d.historico ? '' : `<div class="barra-planilha apresentacao"><div><strong>Apresentação do semestre</strong>
        <span class="suave">Baixe a apresentação com os resultados, o estratificado por local e as evidências.</span></div>
        <div class="acoes-inline">${d.apresentacao ? `<a class="btn sec" href="${esc(d.apresentacao.url)}" target="_blank" rel="noopener">Abrir a da Qualidade</a>` : ''}<button class="btn primario" data-acao="gerarApresentacao">Baixar apresentação</button></div></div>`)
        : modoAvaliador ? '' : d.historico ? '<p class="aviso-hist">Semestre do histórico importado das planilhas (aba Acumulado): há só as notas por indicador, sem itens nem evidências.</p>' : `
      <div class="barra-planilha apresentacao"><div><strong>Apresentação do semestre</strong>
        <span class="suave">${d.apresentacao ? `Última gerada em ${fmtData(d.apresentacao.atualizado_em)}. ` : ''}Monta um PowerPoint no modelo da apresentação de resultados, com gráficos, estratificado por local, evidências com fotos e plano de ação.</span></div>
        <div class="acoes-inline">${d.apresentacao ? `<a class="btn sec" href="${esc(d.apresentacao.url)}" target="_blank" rel="noopener">Abrir a última</a>` : ''}
        <button class="btn primario" data-acao="gerarApresentacao">Gerar apresentação</button></div></div>
      <div class="barra-planilha"><div><strong>Planilha de resultado</strong>
        <span class="suave">${d.planilha ? `Atualizada em ${fmtData(d.planilha.atualizado_em)}. Ela se atualiza sozinha até 10 minutos após cada envio.` : 'Gerada automaticamente até 10 minutos após o primeiro envio, no formato da Avaliação Limpeza.'}</span></div>
        <div class="acoes-inline">${d.planilha ? `<a class="btn sec" href="${esc(d.planilha.url)}" target="_blank" rel="noopener">Abrir planilha</a>` : ''}
        <button class="btn sec" data-acao="gerarPlanilha">${d.planilha ? 'Atualizar agora' : 'Gerar agora'}</button></div></div>`}
      <section class="resultado">
        <div class="nota-final clicavel" data-kpi="final" tabindex="0"><span>Nota final</span><strong ${r.final !== null ? `data-contar="${r.final}"` : ''}>${fmt(r.final)}</strong>
          ${a && a.final !== null ? deltaHTML(r.final, a.final, antRot).replace('class="delta', 'class="delta') + `<small style="margin-top:.2rem">vs ${esc(antRot)} (${fmt(a.final)})</small>` : ''}
          <small>${esc(d.semestre)} · ${d.avaliacoes.length ? d.avaliacoes.length + ' envio(s)' : 'histórico'}</small><span class="dica-clique">Ver composição</span></div>
        <table class="tab-resultado">
          <thead><tr><th>Item avaliado</th><th class="num">Nota${a ? ` <span style="font-weight:500;text-transform:none">· vs ${esc(antRot)}</span>` : ''}</th></tr></thead>
          <tbody>
            <tr class="grupo-linha"><th colspan="2">Limpeza geral <span>peso ${r.pesos.limpeza}</span></th></tr>
            ${linha('geral')}${linha('predial_garagem')}${linha('predial_pa')}
            <tr class="grupo-linha"><th colspan="2">Limpeza parcial <span>peso ${r.pesos.limpeza}</span></th></tr>
            ${linha('parcial')}
            <tr class="grupo-linha"><th colspan="2">Apresentação <span>peso ${r.pesos.uniforme}</span></th></tr>
            <tr class="clicavel" data-kpi="cat" data-chave="uniforme"><td>Higiene pessoal e uniforme</td><td class="num">${fmt(r.uniforme.nota)}${deltaHTML(r.uniforme.nota, a && a.uniforme, antRot)}</td></tr>
            <tr class="grupo-linha"><th colspan="2">EPIs <span>peso ${r.pesos.epi}</span></th></tr>
            <tr class="clicavel" data-kpi="cat" data-chave="epi"><td>Uso adequado de EPIs</td><td class="num">${fmt(r.epi.nota)}${deltaHTML(r.epi.nota, a && a.epi, antRot)}</td></tr>
          </tbody>
          <tfoot><tr><th>Nota final</th><th class="num">${fmt(r.final)}</th></tr></tfoot>
        </table>
      </section>
      ${d.historico ? '' : `<h2 class="titulo-sec">Resultado por checklist</h2>
      <section class="cards">${ORDEM_CK.map((k) => cardChecklist(k, r.checklists[k], a && a.checklists[k])).join('')}
        ${cardSimples('Uniforme e higiene pessoal', r.uniforme, 'uniforme')}${cardSimples('Uso de EPIs', r.epi, 'epi')}</section>
      ${estratificadoHTML(d)}
      ${criticosHTML(d.estratificado && d.estratificado.itensCriticos)}
      ${d.observacoes.length ? `<details class="mapa bloco" style="margin-top:1.5rem"><summary>Todas as evidências e motivos (${d.observacoes.length})</summary><div style="margin-top:1rem">${listaObservacoes(d.observacoes, false)}</div></details>` : ''}`}
      <h2 class="titulo-sec">Acumulado</h2>
      <section class="bloco">${tabelaAcumulado(d)}<div class="grafico-linha"><canvas id="gAcum"></canvas></div></section>`;
    ORDEM_CK.forEach((k) => { const c = r.checklists[k]; if (c.total) state.charts.push(donut($('#g-' + k), c.contagem)); });
    graficoAcumulado(d.acumulado);
    observarFotos();
    if (!el.classList.contains('quieto')) animarNumeros(el);
  }

  VIEWS.resultado = function (cid) {
    app.innerHTML = topo('inicio') + `<main class="pagina"><div id="conteudo">${esqueleto()}</div></main>`;
    carregarVista('meuResultado', { id: cid }, (d) => { if (!$('#conteudo')) return; limparGraficos(); renderPainelFilial(d, true); });
  };

  // encarregados de limpeza e gerentes: resultados validados das filiais com acesso
  VIEWS.resultados = function () {
    app.innerHTML = topo('resultados') + `<main class="pagina"><div id="conteudo">${esqueleto()}</div></main>`;
    carregarVista('painelGestor', { semestre: state.semestre, filial: state.filial }, (d) => {
      if (!$('#conteudo')) return;
      state.semestre = d.semestre; limparGraficos();
      if (d.bloqueado) {
        state.painelAtual = d;
        $('#conteudo').innerHTML = `<div class="painel-cab"><h1>${esc((d.filiais.find((x) => x.id === d.filial) || {}).nome || 'Resultados')}</h1>${filtros(d, d.permitidas.length > 1)}</div>
          ${rodadaHTML(d)}<div class="bloco vazio"><p><b>Resultado em análise.</b><br>${esc(d.mensagem)}</p></div>`;
        return;
      }
      d.filial ? renderPainelFilial(d, 'gestor') : renderPainelGeral(d);
    });
  };

  /* ---------- KPIs clicáveis: janelas com o detalhe ---------- */
  function abrirKpi(tipo, chave) {
    const d = state.painelAtual; if (!d) return;
    if (tipo === 'final') return d.filial || d.rodada ? modalComposicao(d) : modalConsolidado(d);
    if (tipo === 'ck') return modalChecklist(d, chave);
    if (tipo === 'cat') return modalCategoria(d, chave);
    if (tipo === 'local') return modalLocal(d, Number(chave));
  }
  const cabModal = (d, titulo) => `<span class="aud-ciclo">${esc(nomeFilial(d).nome || 'Todas as filiais')} · ${esc(d.semestre)}</span><h2>${esc(titulo)}</h2>`;
  const kpi = (rot, val, extra, destaque) => `<div class="kpi ${destaque ? 'destaque' : ''}"><small>${rot}</small><strong>${val}</strong>${extra || ''}</div>`;
  const distHTML = (c, total) => `<ul class="dist">${['O', 'B', 'R', 'I'].map((n) => `<li><i class="ponto n-${n}"></i><span>${NOMES[n]}</span><b>${pct(c[n], total)}</b><em>${c[n]}</em></li>`).join('')}
    <li class="na"><i class="ponto n-NA"></i><span>Não aplicável</span><b></b><em>${c.NA || 0}</em></li></ul>`;

  function modalComposicao(d) {
    const r = d.resumo, a = d.anterior;
    const itens = ORDEM_CK.map((k) => ({ nome: rotuloIndicador(k, d), peso: r.pesos.limpeza, nota: r.checklists[k].nota, ant: a && a.checklists[k] }))
      .concat([{ nome: 'Higiene pessoal e uniforme', peso: r.pesos.uniforme, nota: r.uniforme.nota, ant: a && a.uniforme },
        { nome: 'Uso adequado de EPIs', peso: r.pesos.epi, nota: r.epi.nota, ant: a && a.epi }]);
    const validos = itens.filter((i) => i.nota !== null && i.nota !== undefined);
    const somaPesos = validos.reduce((t, i) => t + i.peso, 0);
    const pior = validos.slice().sort((x, y) => x.nota - y.nota)[0];
    const perda = validos.map((i) => ({ nome: i.nome, perda: (100 - i.nota) * i.peso / (somaPesos || 1) })).sort((x, y) => y.perda - x.perda)[0];
    modal(`<div class="kpi-modal">${cabModal(d, 'Como a nota final é formada')}
      <div class="kpis">${kpi('Nota final', fmt(r.final), '', true)}${kpi(a ? 'Anterior · ' + esc(a.semestre) : 'Semestre anterior', a ? fmt(a.final) : '—')}
        ${kpi('Variação', a && a.final !== null && r.final !== null ? (r.final >= a.final ? '+' : '−') + fmt(Math.abs(r.final - a.final)) : '—')}
        ${kpi('Maior perda de pontos', perda ? esc(perda.nome.replace('Nível de limpeza ', '')) : '—', perda ? `<small>−${fmt(perda.perda)} ponto(s) na nota final</small>` : '')}</div>
      <div class="rolagem"><table class="tab-lista"><thead><tr><th>Indicador</th><th class="num">Peso</th><th class="num">Nota</th><th class="num">Contribuição</th><th>Participação na nota</th><th class="num">Anterior</th></tr></thead><tbody>
      ${itens.map((i) => { const c = i.nota === null || i.nota === undefined ? null : i.nota * i.peso / somaPesos;
        return `<tr><td>${esc(i.nome)}</td><td class="num">${i.peso}</td><td class="num"><span class="nota-cel ${classeNota(i.nota)}">${fmt(i.nota)}</span>${deltaHTML(i.nota, i.ant)}</td>
          <td class="num">${c === null ? '—' : fmt(c)}</td><td><div class="barra-peso"><span style="width:${c === null ? 0 : Math.min(100, c / (r.final || 1) * 100).toFixed(1)}%"></span></div></td><td class="num">${fmt(i.ant)}</td></tr>`; }).join('')}
      </tbody><tfoot><tr><th>Nota final</th><th class="num">${somaPesos}</th><th class="num">${fmt(r.final)}</th><th class="num">${fmt(r.final)}</th><th></th><th class="num">${a ? fmt(a.final) : '—'}</th></tr></tfoot></table></div>
      <p class="suave" style="margin-top:1rem">Cada indicador vai de 0 a 100 (Ótimo 5 · Bom 4,5 · Regular 3 · Insatisfatório 2; NA fica fora da conta). A nota final é a média ponderada: limpezas peso 5, uniforme peso 1 e EPI peso 3. ${pior ? `O indicador mais baixo foi <b>${esc(pior.nome)}</b> (${fmt(pior.nota)}).` : ''}</p></div>`, true);
  }

  function modalChecklist(d, k) {
    const c = d.resumo.checklists[k], est = d.estratificado || { locais: [], veiculos: [], itensCriticos: [] };
    const ant = d.anterior && d.anterior.checklists[k];
    if (!c.total) { toast('Sem avaliações deste checklist no semestre.', 'aviso'); return; }
    const locais = est.locais.filter((l) => l.checklists[k]);
    const veics = est.veiculos.filter((v) => v.checklist === k);
    const crit = est.itensCriticos.filter((i) => i.checklist === k);
    const envios = d.avaliacoes.filter((x) => x.checklist === k);
    const unidade = CHECKLISTS[k] && CHECKLISTS[k].tipo === 'veiculo' ? 'veículo' : 'local';
    const corpo = modal(`<div class="kpi-modal">${cabModal(d, nomeCk(k))}
      <div class="kpis">${kpi('Nota', fmt(c.nota), deltaHTML(c.nota, ant), true)}${kpi('% positivo', fmt(c.positivo, 1) + '%')}${kpi('Itens avaliados', c.total, `<small>${veics.length} ${unidade}(s) · ${fmt(c.total / Math.max(veics.length, 1), 0)} itens por ${unidade}</small>`)}${kpi('Semestre anterior', fmt(ant))}</div>
      <div class="det-resumo"><div class="donut pequeno"><canvas id="gKpi"></canvas><div class="donut-centro"><strong>${fmt(c.positivo, 1)}%</strong><small>positivo</small></div></div>${distHTML(c.contagem, c.total)}</div>
      ${locais.length ? `<h3>Por local</h3><div class="rolagem"><table class="tab-lista"><thead><tr><th>Local</th><th class="num">Itens</th><th>Distribuição</th><th class="num">% positivo</th><th class="num">Nota</th></tr></thead><tbody>
        ${locais.map((l) => { const x = l.checklists[k]; return `<tr><td><strong>${esc(l.local)}</strong><span class="tag-local ${l.tipo}">${l.tipo === 'garagem' ? 'Garagem' : 'Ponto'}</span></td><td class="num">${x.total}</td>
          <td><div class="mini-barra" style="height:10px">${barraDist(x.contagem)}</div></td><td class="num">${fmt(x.positivo, 1)}%</td><td class="num"><span class="nota-cel ${classeNota(x.nota)}">${fmt(x.nota)}</span></td></tr>`; }).join('')}</tbody></table></div>` : ''}
      ${veics.length ? `<h3>${unidade === 'veículo' ? 'Veículo por veículo' : 'Local por local'}</h3><div class="veic-grid">${veics.map((v) => `<div class="veic"><small>${esc(v.grupo)}</small>
        <b>${esc(v.coluna)}</b> <span class="nota-cel ${classeNota(v.nota)}">${fmt(v.nota)}</span><div class="mini-barra">${barraDist(v.contagem)}</div>
        ${v.criticos.length ? `<div class="criticos-v">${esc(v.criticos.join(', '))}</div>` : ''}</div>`).join('')}</div>` : ''}
      ${crit.length ? `<h3>Itens pontuados</h3>${criticosHTML(crit, false)}` : '<p class="aviso-hist" style="margin-top:1rem">Nenhum item Regular ou Insatisfatório neste checklist.</p>'}
      ${envios.length ? `<h3>Checklists enviados</h3><div class="rolagem"><table class="tab-lista"><thead><tr><th>Avaliador</th><th>Inspeção</th><th>Veículos / locais</th><th class="num">Nota</th><th></th></tr></thead><tbody>
        ${envios.map((x) => `<tr><td>${esc(x.nome)}</td><td>${fmtData(x.data_inspecao)}</td><td>${esc(x.colunas.join(', '))}</td><td class="num"><b>${fmt(x.nota)}</b></td><td><button class="btn sec pequeno" data-detalhe="${esc(x.id)}">Abrir</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>`, true);
    state.chartsModal.push(donut($('#gKpi', corpo), c.contagem));
    observarFotos(corpo);
  }

  function modalCategoria(d, cat) {
    const c = d.resumo[cat], est = d.estratificado || { locais: [], itensCriticos: [] }, ant = d.anterior && d.anterior[cat];
    const titulo = cat === 'uniforme' ? 'Higiene pessoal e uniforme' : 'Uso adequado de EPIs';
    const re = cat === 'uniforme' ? /uniforme/i : /\bEPI/i;
    const crit = est.itensCriticos.filter((i) => re.test(i.item));
    const corpo = modal(`<div class="kpi-modal">${cabModal(d, titulo)}
      <div class="kpis">${kpi('Nota', fmt(c.nota), deltaHTML(c.nota, ant), true)}${kpi('Avaliações', c.total)}${kpi('Semestre anterior', fmt(ant))}${kpi('Peso na nota final', cat === 'uniforme' ? '1' : '3')}</div>
      ${c.total ? `<div class="det-resumo"><div class="donut pequeno"><canvas id="gKpi"></canvas><div class="donut-centro"><strong>${fmt(c.positivo, 1)}%</strong><small>positivo</small></div></div>${distHTML(c.contagem, c.total)}</div>` : ''}
      ${est.locais.length ? `<h3>Por local</h3><div class="rolagem"><table class="tab-lista"><thead><tr><th>Local</th><th class="num">Nota</th></tr></thead><tbody>
        ${est.locais.map((l) => `<tr><td><strong>${esc(l.local)}</strong><span class="tag-local ${l.tipo}">${l.tipo === 'garagem' ? 'Garagem' : 'Ponto'}</span></td><td class="num"><span class="nota-cel ${classeNota(l[cat])}">${fmt(l[cat])}</span></td></tr>`).join('')}</tbody></table></div>` : ''}
      ${crit.length ? `<h3>Itens pontuados</h3>${criticosHTML(crit, false)}` : '<p class="aviso-hist" style="margin-top:1rem">Sem apontamentos neste indicador. Lembrete: aqui, qualquer nota abaixo de Ótimo exige foto e motivo.</p>'}
    </div>`, true);
    if (c.total) state.chartsModal.push(donut($('#gKpi', corpo), c.contagem));
    observarFotos(corpo);
  }

  function modalLocal(d, i) {
    const est = d.estratificado, l = est && est.locais[i]; if (!l) return;
    const veics = est.veiculos.filter((v) => v.grupo === l.local);
    const crit = est.itensCriticos.filter((it) => it.locais.some((x) => x === l.local || x.indexOf(l.local + ' · ') === 0));
    const cks = ORDEM_CK.filter((k) => l.checklists[k]);
    const corpo = modal(`<div class="kpi-modal">${cabModal(d, l.local)}<span class="tag-local ${l.tipo}" style="margin:0">${l.tipo === 'garagem' ? 'Garagem' : 'Ponto de apoio'}</span>
      <div class="kpis">${kpi('Nota de limpeza do local', fmt(l.nota), '', true)}${kpi('% positivo', fmt(l.positivo, 1) + '%')}${kpi('Itens avaliados', l.total)}${kpi('Uniforme · EPI', fmt(l.uniforme) + ' · ' + fmt(l.epi))}</div>
      <div class="det-resumo"><div class="donut pequeno"><canvas id="gKpi"></canvas><div class="donut-centro"><strong>${fmt(l.positivo, 1)}%</strong><small>positivo</small></div></div>${distHTML(l.contagem, l.total)}</div>
      <h3>Checklists neste local</h3><div class="rolagem"><table class="tab-lista"><thead><tr><th>Checklist</th><th class="num">Itens</th><th>Distribuição</th><th class="num">Nota</th></tr></thead><tbody>
        ${cks.map((k) => { const x = l.checklists[k]; return `<tr class="clicavel" data-kpi="ck" data-chave="${k}"><td>${esc(nomeCk(k))}</td><td class="num">${x.total}</td><td><div class="mini-barra" style="height:10px">${barraDist(x.contagem)}</div></td><td class="num"><span class="nota-cel ${classeNota(x.nota)}">${fmt(x.nota)}</span></td></tr>`; }).join('')}</tbody></table></div>
      ${veics.length ? `<h3>Veículos e áreas avaliados</h3><div class="veic-grid">${veics.map((v) => `<div class="veic"><small>${esc(nomeCk(v.checklist))}</small><b>${esc(v.coluna)}</b> <span class="nota-cel ${classeNota(v.nota)}">${fmt(v.nota)}</span>
        <div class="mini-barra">${barraDist(v.contagem)}</div>${v.criticos.length ? `<div class="criticos-v">${esc(v.criticos.join(', '))}</div>` : ''}</div>`).join('')}</div>` : ''}
      ${crit.length ? `<h3>Itens pontuados neste local</h3>${criticosHTML(crit, false)}` : '<p class="aviso-hist" style="margin-top:1rem">Nenhum item Regular ou Insatisfatório neste local.</p>'}
    </div>`, true);
    state.chartsModal.push(donut($('#gKpi', corpo), l.contagem));
    observarFotos(corpo);
  }

  function modalConsolidado(d) {
    const fs = (d.porFilial || []).filter((f) => f.final !== null && f.final !== undefined).sort((x, y) => y.final - x.final);
    if (!fs.length) return;
    const media = fs.reduce((t, f) => t + f.final, 0) / fs.length;
    modal(`<div class="kpi-modal">${cabModal(d, 'Ranking das filiais')}
      <div class="kpis">${kpi('Nota consolidada', fmt(d.resumo.final), '', true)}${kpi('Média das filiais', fmt(media))}${kpi('Melhor', esc(fs[0].nome), `<small>${fmt(fs[0].final)}</small>`)}${kpi('Atenção', esc(fs[fs.length - 1].nome), `<small>${fmt(fs[fs.length - 1].final)} · ${fmt(fs[0].final - fs[fs.length - 1].final)} abaixo da melhor</small>`)}</div>
      <div class="rolagem"><table class="tab-lista"><thead><tr><th>#</th><th>Filial</th><th>Locais vistos</th><th>Avaliador</th><th class="num">Nota final</th><th class="num">${d.semestreAnterior ? esc(d.semestreAnterior) : 'Anterior'}</th></tr></thead><tbody>
      ${fs.map((f, i) => `<tr class="clicavel" data-ver-filial="${esc(f.id)}"><td><b>${i + 1}º</b></td><td><strong>${esc(f.nome)}</strong></td><td>${esc([f.garagem].concat(f.pontos || []).join(', '))}</td><td>${esc((f.avaliadores || []).join(', ') || '—')}</td>
        <td class="num"><span class="nota-cel ${classeNota(f.final)}">${fmt(f.final)}</span>${deltaHTML(f.final, f.anterior)}</td><td class="num">${fmt(f.anterior)}</td></tr>`).join('')}</tbody></table></div>
      <p class="suave" style="margin-top:1rem">Clique numa filial para abrir o painel dela.</p></div>`, true);
  }

  function cardChecklist(k, c, ant) {
    const titulo = CHECKLISTS[k].titulo;
    if (!c.total) return `<article class="card sem-dados"><header><h3>${esc(titulo)}</h3></header><p class="suave">Sem envios neste semestre.</p></article>`;
    return `<article class="card clicavel" data-kpi="ck" data-chave="${k}" tabindex="0"><header><h3>${esc(titulo)}</h3><span class="dica-clique">Detalhar</span></header>

  /* fotos sob demanda (ficam privadas no Drive e passam pela API) */
  let observador;

    } catch (e) { el.innerHTML = `<span>${esc(e.message)}</span>`; }

  /* ==========================================================================
   * APRESENTAÇÃO (.pptx) gerada com os dados recebidos — modelo da apresentação de resultados
   * ========================================================================== */
  function carregarScript(urls) {
    return new Promise((resolve, reject) => {
      const tentar = (i) => {
        if (window.PptxGenJS) return resolve();
        if (i >= urls.length) return reject(new Error('Não foi possível carregar o gerador de apresentações. Verifique a internet e tente de novo.'));
        const sc = document.createElement('script'); sc.src = urls[i];
        sc.onload = () => resolve(); sc.onerror = () => { sc.remove(); tentar(i + 1); };
        document.head.appendChild(sc);
      };
      tentar(0);
    });
  }
  async function fotoBase64(id) {
    if (state.fotos.has(id)) return state.fotos.get(id);
    const r = await api('foto', { id }); const src = `data:${r.mime};base64,${r.base64}`; state.fotos.set(id, src); return src;
  }
  const nf = (n, d = 2) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const listaBR = (arr) => arr.length <= 1 ? (arr[0] || '') : arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1];

  async function montarPptx(d) {
    const C = { esc: '023D3A', verde: '007A6E', teal: '00A19B', aqua: '1CCFC9', menta: 'D6F0ED', claro: 'F2FAFA', cinza: '5E7D7A', branco: 'FFFFFF', verm: 'E6062E', tinta: '12232A' };
    const CN = { O: '0B8F86', B: '4DC8BB', R: 'E0A21B', I: 'C8372D' };
    const FT = 'Segoe UI', FB = 'Segoe UI Semibold';
    const f = nomeFilial(d), r = d.resumo, ro = d.rodada || {}, est = d.estratificado || { locais: [], veiculos: [], itensCriticos: [] };
    const sem = d.semestre, m = String(sem).match(/(\d)º Semestre\/(\d{2})/), semLongo = m ? `${m[1]}º Semestre • 20${m[2]}` : sem;
    const locais = [f.garagem].concat(ro.pontos || []).filter(Boolean);
    const pptx = new window.PptxGenJS();
    pptx.layout = 'LAYOUT_WIDE'; pptx.author = 'Qualidade · Univale'; pptx.company = 'Univale'; pptx.title = `Avaliação de Limpeza ${f.nome} ${sem}`;
    const W = 13.333, H = 7.5;
    const S = pptx.ShapeType;
    const bola = (sl, x, y, dd, cor, tr) => sl.addShape(S.ellipse, { x, y, w: dd, h: dd, fill: { color: cor, transparency: tr }, line: { color: cor, transparency: 100 } });
    const ret = (sl, x, y, w, h, cor, extra) => sl.addShape(S.rect, Object.assign({ x, y, w, h, fill: { color: cor }, line: { color: cor, transparency: 100 } }, extra || {}));
    const txt = (sl, t, o) => sl.addText(t, Object.assign({ fontFace: FT, color: C.branco, margin: 0, valign: 'top' }, o));
    const logo = (sl, branca, x = W - 1.75, y = H - 0.62, w = 1.35) => { const src = branca ? LOGO_BRANCA : LOGO_COR; if (src) sl.addImage({ data: src, x, y, w, h: w * (branca ? 118 / 310 : 140 / 360) }); };
    const titulo2 = (sl, a, b, x, y, w, corB) => txt(sl, [{ text: a, options: { fontSize: 34, color: C.branco, breakLine: true } }, { text: b, options: { fontSize: 30, bold: true, color: corB || C.esc } }], { x, y, w, h: 1.6 });

    /* 1. Capa */
    let sl = pptx.addSlide(); sl.background = { color: C.esc };
    bola(sl, 7.2, -1.6, 7.6, C.teal, 70); bola(sl, 9.6, 3.6, 4.6, C.aqua, 82); bola(sl, 6.4, 4.9, 2.2, C.branco, 92);

    txt(sl, `Filial ${f.nome}`, { x: 1.05, y: 4.45, w: 7, h: 0.5, fontSize: 20, bold: true });
    txt(sl, listaBR(locais), { x: 1.05, y: 4.95, w: 7.2, h: 0.8, fontSize: 14, color: C.menta });
    bola(sl, 1.05, 6.55, 0.14, C.verm, 0); txt(sl, 'REG-UTL-176 · Checklist de Limpeza', { x: 1.3, y: 6.47, w: 5, h: 0.3, fontSize: 11, color: C.menta });
    logo(sl, true, W - 2.6, H - 1.05, 2.1);

    /* 2. Avaliador, locais e período */
    sl = pptx.addSlide(); sl.background = { color: C.teal };
    bola(sl, -1.4, -1.4, 4.4, C.esc, 80); bola(sl, 10.4, 4.4, 4.2, C.aqua, 70);
    const quem = (ro.avaliadores && ro.avaliadores.length ? ro.avaliadores : ro.enviaram) || [];
    const bloco = (x, y, rot, val, sub) => {
      sl.addShape(S.roundRect, { x, y, w: 5.85, h: 2.75, rectRadius: 0.2, fill: { color: C.branco, transparency: 88 }, line: { color: C.branco, transparency: 70, width: 1 } });
      bola(sl, x + 0.4, y + 0.42, 0.22, C.aqua, 0);
      txt(sl, rot, { x: x + 0.8, y: y + 0.3, w: 4.8, h: 0.55, fontSize: 28, bold: true, fontFace: FB });
      txt(sl, val, { x: x + 0.4, y: y + 1.0, w: 5.15, h: 1.05, fontSize: 21, valign: 'middle' });
      if (sub) txt(sl, sub, { x: x + 0.4, y: y + 2.12, w: 5.15, h: 0.45, fontSize: 13, color: C.esc, bold: true });
    };
    bloco(0.7, 0.75, quem.length > 1 ? 'Avaliadores' : 'Avaliador', listaBR(quem) || '—', ro.checklists ? `${ro.checklists} checklist(s) enviado(s)` : '');
    bloco(6.78, 0.75, 'Local', listaBR(locais), (ro.pontos || []).length ? `${ro.pontos.length} ponto(s) de apoio nesta rodada` : 'Somente a garagem nesta rodada');
    bloco(0.7, 3.8, 'Inspeção', ro.datas && ro.datas.length ? ro.datas.map(fmtData).join(', ') : '—', ro.prazo ? `Escala liberada em ${fmtData(ro.liberacao)} · prazo ${fmtData(ro.prazo)}` : '');
    bloco(6.78, 3.8, 'Resultado', `Nota final ${nf(r.final)}`, ro.liberado ? `Validado pela Qualidade em ${fmtData(ro.liberado_em)}` : 'Aguardando validação da Qualidade');
    logo(sl, true);

    /* 3. Um slide por checklist, com rosca e cartões */
    const TIT = { geral: ['Limpeza Geral', ''], parcial: ['Limpeza Parcial', ''], predial_garagem: ['Limpeza instalações', 'e equipamentos'], predial_pa: ['Limpeza instalações', 'e equipamentos'] };
    const locaisCk = (k) => est.locais.filter((l) => l.checklists[k]).map((l) => l.local.replace(/^Garagem /, ''));
    const slideRosca = (sl2, c, x, y, w) => {
      const ns = ['O', 'B', 'R', 'I'].filter((n) => c.contagem[n]);
      sl2.addChart(pptx.ChartType.doughnut, [{ name: 'Notas', labels: ns.map((n) => NOMES[n]), values: ns.map((n) => c.contagem[n]) }],
        { x, y, w, h: w, holeSize: 64, chartColors: ns.map((n) => CN[n]), showLegend: false, showValue: false, showPercent: false, showTitle: false, dataBorder: { pt: 2.5, color: C.esc } });
      txt(sl2, `${nf(c.positivo, c.positivo % 1 ? 1 : 0)}%`, { x, y: y + w / 2 - 0.6, w, h: 0.85, fontSize: 44, bold: true, align: 'center', fontFace: FB });

    ORDEM_CK.forEach((k) => {
      const c = r.checklists[k]; if (!c.total) return;
      const ts = TIT[k], veics = est.veiculos.filter((v) => v.checklist === k), ehVeic = CHECKLISTS[k].tipo === 'veiculo';
      sl = pptx.addSlide(); sl.background = { color: C.esc };
      ret(sl, 0, 0, 5.75, H, C.verde); bola(sl, 10.9, -0.9, 3.2, C.aqua, 88);
      txt(sl, [{ text: ts[0], options: { fontSize: 32, breakLine: true } }].concat(ts[1] ? [{ text: ts[1], options: { fontSize: 30, bold: true, color: C.esc, breakLine: true } }] : [])
        .concat([{ text: listaBR(locaisCk(k)) || f.nome, options: { fontSize: 18, bold: true, color: C.esc } }]), { x: 0.55, y: 0.45, w: 5, h: 1.8 });
      const nsCk = ['O', 'B', 'R', 'I'].filter((n) => c.contagem[n]);
      nsCk.forEach((n, i) => {
        const y = 2.4 + i * 1.12;
        sl.addShape(S.roundRect, { x: 0.55, y, w: 4.75, h: 0.98, rectRadius: 0.12, fill: { color: C.menta }, line: { color: C.menta } });
        bola(sl, 0.78, y + 0.18, 0.24, CN[n], 0);
        txt(sl, NOMES[n], { x: 1.12, y: y + 0.13, w: 3, h: 0.3, fontSize: 12, color: C.cinza });
        txt(sl, `${nf(c.contagem[n] / c.total * 100, 1)}%`, { x: 0.78, y: y + 0.42, w: 2.6, h: 0.5, fontSize: 26, bold: true, color: C.esc, fontFace: FB });
        txt(sl, `${c.contagem[n]} itens`, { x: 3.5, y: y + 0.52, w: 1.6, h: 0.34, fontSize: 12, color: C.cinza, align: 'right' });
      });
      const locaisDoCk = est.locais.filter((l) => l.checklists[k]);
      if (locaisDoCk.length > 1 && nsCk.length <= 2) { // aproveita o espaço do painel com a nota de cada local

          sl.addShape(S.roundRect, { x: 2.85, y: yy + 0.07, w: 1.6, h: 0.17, rectRadius: 0.08, fill: { color: C.esc, transparency: 60 }, line: { color: C.esc, transparency: 100 } });
          sl.addShape(S.roundRect, { x: 2.85, y: yy + 0.07, w: Math.max(0.1, 1.6 * Math.max(0, (nota - 70) / 30)), h: 0.17, rectRadius: 0.08, fill: { color: C.aqua }, line: { color: C.aqua, transparency: 100 } });
          txt(sl, nf(nota), { x: 4.5, y: yy, w: 0.8, h: 0.3, fontSize: 11.5, bold: true, align: 'right' });

      }
      const porUn = Math.round(c.total / Math.max(veics.length, 1));

      const porLocal = est.locais.filter((l) => l.checklists[k]).map((l) => `${l.local.replace(/^Garagem /, '')} ${nf(l.checklists[k].nota)}`);
      if (porLocal.length > 1 && nsCk.length > 2) txt(sl, 'Por local: ' + porLocal.join('  •  '), { x: 6.1, y: 6.6, w: 6.6, h: 0.3, fontSize: 11, align: 'center', color: C.menta });
